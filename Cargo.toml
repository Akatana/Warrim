[workspace]
resolver = "2"
members = ["crates/mpq", "crates/wowfmt", "crates/wowtool", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.30", features = ["serde"] }
flate2 = "1"
bzip2 = "0.5"
explode = "0.1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
